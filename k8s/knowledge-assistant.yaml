apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-assistant
  labels:
    app: knowledge-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-assistant
  template:
    metadata:
      labels:
        app: knowledge-assistant
    spec:
      containers:
        - name: knowledge-assistant
          image: knowledge-assistant:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: LITELLM_BASE_URL
              value: "http://litellm:4000"
            - name: LITELLM_API_KEY
              value: "sk-local-dev-key"
            - name: LLM_MODEL_NAME
              value: "knowledge-assistant"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-assistant
spec:
  selector:
    app: knowledge-assistant
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort