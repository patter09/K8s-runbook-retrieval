# ConfigMap holds the litellm_config.yaml content as cluster-stored data.
# It gets mounted into the pod as an actual file at runtime — this is the
# Kubernetes-native replacement for docker-compose.yml's simple bind mount
# (`./litellm_config.yaml:/app/config.yaml`), since a pod has no access to
# your local filesystem.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: knowledge-assistant
        litellm_params:
          model: ollama/llama3.2:3b
          api_base: os.environ/OLLAMA_API_BASE

    general_settings:
      # Same os.environ/ reference pattern as api_base above — the actual
      # value comes from the LITELLM_MASTER_KEY env var (set below via
      # secretKeyRef), never written literally in this ConfigMap.
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      automountServiceAccountToken: false
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              # secretKeyRef pulls this value from the litellm-credentials
              # Secret (created imperatively via `kubectl create secret`,
              # never written into any YAML file) instead of a literal
              # "value:" field. This manifest is now safe to commit — it
              # references a secret by name, it doesn't contain one.
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: api-key
            - name: OLLAMA_API_BASE
              value: "http://ollama:11434"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP