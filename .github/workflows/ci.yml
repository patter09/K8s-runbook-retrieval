name: CI

on:
  push:
  pull_request:

jobs:
  sast-scan:
    # SAST — analyzes app/*.py source code itself for injection risks,
    # unsafe patterns, and code smells. Different layer from everything
    # else in this pipeline: gitleaks looks for secrets, Trivy looks at
    # dependency versions, Kyverno looks at infrastructure config — this
    # is the first tool that actually reads our application logic.
    #
    # Deliberately NOT gating the build on a quality gate yet (same
    # "Audit before Enforce" reasoning as the Kyverno policies) — this is
    # the first static analysis this codebase has ever had, so we don't
    # yet know what it will find. Review results on the SonarCloud
    # dashboard first; add a blocking quality-gate check once the
    # baseline is actually clean, the same sequencing used for the
    # Kyverno policies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          
  secret-scan:
    # Fastest possible check, runs first, blocks everything else — same
    # "fail fast" reasoning as guardrail-unit-tests, but for secrets
    # specifically. Two SEPARATE scans on purpose (see .gitleaks-custom.toml
    # for why they can't be merged into one in this gitleaks version):
    #   1. gitleaks' real, unmodified built-in rules (AWS keys, GitHub
    #      tokens, generic high-entropy strings)
    #   2. our custom low-entropy, name-based rule, with the reviewed
    #      baseline applied so known-accepted findings don't fail the build
    #
    # IMPORTANT: scoped to only the commits introduced by THIS push, not
    # full repository history. gitleaks scans git history by default, which
    # means ANY historical commit — including ones already fixed later —
    # gets re-flagged on every single future run forever. That's the wrong
    # design for a per-push gate (it should ask "did THIS push introduce a
    # problem", not "has this repo EVER contained anything flaggable").
    # Full-history scanning remains valuable as a separate, periodic/manual
    # audit — which is exactly what local `gitleaks detect --source .` runs
    # during development already provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      - name: Determine commit range for this push
        id: range
        run: |
          # github.event.before is unset on pull_request events and is all
          # zeros on the very first push to a new branch — both fall back
          # to scanning just the latest commit rather than failing outright.
          # This fallback is a deliberate simplification for a multi-commit
          # PR (it won't scan every commit in the PR individually), noted
          # here rather than hidden.
          if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "opts=--log-opts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "opts=--log-opts=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan with gitleaks' built-in default rules (this push only)
        run: gitleaks detect --source . ${{ steps.range.outputs.opts }} --verbose
      - name: Scan with custom low-entropy rule (this push only, baselined)
        run: gitleaks detect --source . --config .gitleaks-custom.toml ${{ steps.range.outputs.opts }} --baseline-path .gitleaks-baseline.json --verbose

  guardrail-unit-tests:
    # Fast, deterministic checks — no LLM/model dependency, runs on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  eval-gate:
    # Depends on BOTH fast checks passing first — no point spending 5-10
    # minutes pulling a model and running eval if a cheap, fast check
    # already caught a regression (secret leak or code bug). "Fail fast"
    # ordering, now covering security as well as correctness.
    needs: [guardrail-unit-tests, secret-scan]
    # Full RAG pipeline eval: spins up Qdrant + Ollama, ingests the sample
    # docs, and runs eval/run_eval.py as a merge gate.
    #
    # NOTE (talking point for the interview): pulling and running an LLM in
    # a GitHub-hosted runner is slow and resource-constrained. A real
    # deployment points this job at a shared, already-warm model endpoint
    # (the same LiteLLM gateway the app uses in production) instead of
    # spinning up a fresh model per CI run. This job is kept here to show
    # the *pattern* end-to-end; production would swap the local Ollama
    # service below for the shared platform endpoint.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:3b

      - name: Start LiteLLM gateway
        env:
          OLLAMA_API_BASE: http://localhost:11434
          LITELLM_MASTER_KEY: ${{ secrets.CI_LITELLM_KEY }}
        run: |
          pip install 'litellm[proxy]'
          litellm --config litellm_config.yaml --port 4000 &
          sleep 5

      - name: Ingest sample docs
        env:
          LITELLM_API_KEY: ${{ secrets.CI_LITELLM_KEY }}
          APP_API_KEY: ${{ secrets.CI_APP_KEY }}
        run: python app/ingest.py data/sample_docs

      - name: Run eval gate
        env:
          LITELLM_API_KEY: ${{ secrets.CI_LITELLM_KEY }}
          APP_API_KEY: ${{ secrets.CI_APP_KEY }}
        run: python eval/run_eval.py --threshold 0.75