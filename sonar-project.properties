sonar.projectKey=patter09_K8s-runbook-retrieval
sonar.organization=patter09

# Only the application code — not venv, node_modules-equivalents, or
# generated files. Analyzing everything under the repo root would flag
# noise in files we don't control (e.g. anything vendored) rather than
# code we actually wrote and can act on.
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.11

# UTF-8 explicitly, rather than relying on SonarCloud's auto-detection —
# avoids a class of encoding-related false positives on non-ASCII content.
sonar.sourceEncoding=UTF-8